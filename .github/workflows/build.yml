name: Build and Push Optimized Visual Chromium

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image locally and verify size
        run: |
          echo "=== Building Docker image locally ==="
          docker build -t test-chromium .
          echo "=== Docker Image Size ==="
          docker images test-chromium

      - name: Install Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}
          organization: voss

      - name: Build and push image to KraftCloud
        run: unikraft build . --output voss/visual-chromium-cdp:latest
