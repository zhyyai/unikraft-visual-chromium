name: Build and Push Optimized Visual Chromium

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Docker build and rootfs size
        run: |
          echo "=== Building Docker image ==="
          docker build -t test-chromium .
          echo "=== Image Size ==="
          docker images test-chromium
          echo "=== Filesystem Breakdown ==="
          docker run --rm test-chromium sh -c "du -sh /usr /opt /lib /app /etc 2>/dev/null"

      - name: Install Unikraft CLI
        uses: unikraft/setup-action@v1
        with:
          token: ${{ secrets.KRAFTCLOUD_TOKEN }}
          organization: voss

      - name: Build and push image to KraftCloud
        run: unikraft build . --output voss/visual-chromium-cdp:latest
